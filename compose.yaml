services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: buildflow
      POSTGRES_PASSWORD: buildflow_local
      POSTGRES_DB: buildflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - buildflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildflow"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  buildflow_data:
